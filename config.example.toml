# Crabinet configuration format. This file is loaded once at process startup.
# Restart Crabinet after every change; configuration is never hot-reloaded.
version = 1

[server]
# An explicit IP address and port. Hostnames are intentionally not accepted.
listen = "127.0.0.1:8080"
# Relative paths are resolved against this configuration file's directory.
database_path = "data/crabinet.sqlite3"
# Create this separately with at least 32 random bytes. It must be owner-only
# (`chmod 600`); a secret any group or other user can access is rejected.
session_secret_file = "secrets/session.key"
# Sizes are positive integers with an explicit binary unit: B, KiB, MiB, or GiB.
max_upload_size = "100 MiB"
max_preview_size = "2 MiB"
# Each Argon2 verifier uses up to the hash's accepted memory parameter. Keep this at 1
# for small pods and increase only after measuring the release image under its limit.
auth_max_concurrent = 1
session_idle_timeout_seconds = 1800
session_absolute_timeout_seconds = 43200
login_attempts_per_minute = 5
# Attempts from one source address per minute across all usernames, checked before
# any Argon2 work so one client cannot monopolize the verifier by cycling usernames.
login_attempts_per_source_per_minute = 20
# Behind a reverse proxy every client shares the proxy's address. List only the
# proxy's own addresses or CIDR ranges (never 0.0.0.0/0 or ::/0) so login limits use
# the client address the proxy appends to the header. Empty ignores forwarding headers.
# trusted_proxies = ["127.0.0.1", "::1"]
# trusted_proxy_header = "x-forwarded-for"  # or "forwarded" (RFC 7239)
# Deterministic oldest-first cleanup keeps persistent session state bounded even when
# clients repeatedly omit their previous cookie.
max_sessions_per_user = 16
max_sessions_total = 4096
# Trash items become eligible for background permanent removal after 30 days.
trash_retention_days = 30
# Simultaneously open client connections, including idle keep-alive connections and
# event streams. New connections above the cap are closed. Keep the process's open-file
# limit comfortably above it.
max_connections = 1024
# Seconds a client has to send a complete request head. This also closes idle keep-alive
# connections between requests, so keep it above the reverse proxy's idle upstream timeout
# (Caddy: 2 minutes, nginx: 60 seconds). Lower it only when the port is exposed directly.
header_read_timeout_seconds = 300

[auth]
# Password sign-in remains enabled by default. Enable OIDC to show both methods.
# The sign-in page is shown even when Google is the only initial method.
password_enabled = true
oidc_enabled = false
# Gravatar avatars are off by default: when enabled, browsers send a hash of each
# user's configured email address to gravatar.com on every page load.
gravatar_enabled = false

# When oidc_enabled = true, uncomment and configure this section. Register the
# redirect_uri exactly with the provider and store the client secret outside shares,
# owner-only (`chmod 600`) like the session secret.
# [auth.oidc]
# issuer = "https://identity.example.com"
# client_id = "crabinet"
# client_secret_file = "secrets/oidc-client-secret"
# redirect_uri = "https://files.example.com/api/v1/auth/oidc/callback"

# Optional passkeys. Use the exact public origin (including a nondefault port).
# An initial password or OIDC method is still required to enroll and recover keys.
# [auth.passkeys]
# origin = "https://files.example.com"

# Generate a hash with `crabinet hash-password`. Never put a clear-text password here.
[[users]]
username = "alice"
email = "alice@example.com"
# Optional with OIDC: also require the ID token's `sub` claim, the provider's stable
# account ID, so a verified email reassigned at the provider cannot take over
# this account. Requires email.
# oidc_subject = "110169484474386276334"
password_hash = "$argon2id$v=19$m=65536,t=3,p=1$c29tZXNhbHQ$RdescudvJCsgt3ub+b+dWRWJTmaaJObG"
# The example account is intentionally disabled. Replace the hash, then opt in by
# changing this to false; disabled users cannot log in or reuse existing sessions.
disabled = true

# IDs are stable URL identifiers that start with a letter or digit. Renaming one
# changes its externally visible identity.
[[shares]]
id = "documents"
# Names are display-only and can be changed without breaking URLs.
name = "Documents"
path = "/srv/crabinet/documents"
# This overrides write grants, which become read-only at runtime.
read_only = false

[[shares.grants]]
user = "alice"
permission = "write"
