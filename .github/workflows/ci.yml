name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.90.0
  NODE_VERSION: 24

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo
          docker.io/rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
      # The read-only token enables zizmor's online audits, such as impostor
      # commits and pinned SHAs that do not match their version comment.
      - name: Audit GitHub Actions workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm
          -e GH_TOKEN
          -v "${PWD}:/repo:ro"
          -w /repo
          ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --no-progress
          --format github
          .github/workflows

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Install audited esbuild binary
        working-directory: web
        run: npm rebuild esbuild --ignore-scripts=false
      - name: Check formatting
        working-directory: web
        run: npm run format:check
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: Test
        working-directory: web
        run: npm test
      - name: Build production assets
        working-directory: web
        run: npm run build
      - name: Upload production assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust
    needs: frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download production assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt
      # Only main writes the cache, so pull requests restore but cannot poison it.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo +"${RUST_VERSION}" fmt --all -- --check
      - name: Run tests
        run: cargo +"${RUST_VERSION}" test --locked --all-targets --all-features

  clippy:
    name: Clippy
    needs: frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download production assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy
        run: cargo +"${RUST_VERSION}" clippy --locked --all-targets --all-features -- -D warnings

  browser-e2e:
    name: Browser E2E
    needs: frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download production assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build production executable with embedded assets
        run: cargo +"${RUST_VERSION}" build --locked --release
      - name: Run production browser suite
        working-directory: web
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-results
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Check fuzz harness advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          command-arguments: advisories

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  semgrep:
    name: Semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test project Semgrep rules
        id: rules
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          docker run --rm
          -e SEMGREP_SEND_METRICS
          -v "${PWD}:/src"
          -w /src
          docker.io/semgrep/semgrep@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
          semgrep scan --test --config .semgrep/ .semgrep/
      # .semgrep/ holds rule fixtures that deliberately violate the rules.
      - name: Run Semgrep
        id: scan
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          docker run --rm
          -e SEMGREP_SEND_METRICS
          -v "${PWD}:/src"
          -w /src
          docker.io/semgrep/semgrep@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
          semgrep scan
          --config .semgrep/
          --config p/default
          --config p/secrets
          --config p/r2c-security-audit
          --config p/typescript
          --exclude .semgrep
          --error --sarif --output semgrep.sarif .
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Enforce Semgrep result
        if: steps.rules.outcome == 'failure' || steps.scan.outcome == 'failure'
        run: exit 1

  trivy:
    name: Trivy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy.sarif
          category: trivy-filesystem
      - name: Enforce Trivy result
        if: steps.scan.outcome == 'failure'
        run: exit 1

  # Builds the image the way the release does: a static musl executable from
  # the CI-built frontend, copied into the scratch Containerfile.
  container-image:
    name: Container image
    needs: frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      ARCH: amd64
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download production assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Install native musl toolchain and OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools skopeo
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup +"${RUST_VERSION}" target add "${TARGET}"
      # No build cache: like the release, the image is built from clean state.
      - name: Build static release executable
        env:
          CC: musl-gcc
        run: cargo +"${RUST_VERSION}" build --locked --release --target "${TARGET}"
      - name: Verify static executable and prepare image context
        run: |
          binary="target/${TARGET}/release/crabinet"
          if ldd "${binary}" 2>&1 | grep -vqiE 'not a dynamic executable|statically linked'; then
            echo "Release executable is dynamically linked" >&2
            ldd "${binary}" || true
            exit 1
          fi
          mkdir -p "image-context/release/crabinet-linux-${ARCH}" image-output
          cp Containerfile LICENSE THIRD_PARTY_LICENSES.md image-context/
          install -m 0555 "${binary}" "image-context/release/crabinet-linux-${ARCH}/crabinet"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: image-context/Containerfile
          platforms: linux/${{ env.ARCH }}
          build-args: VERSION=ci-${{ github.sha }}
          outputs: type=oci,dest=image-output/crabinet-${{ env.ARCH }}.tar
          provenance: mode=max
          sbom: true
      - name: Extract OCI layout for scanning
        run: |
          mkdir -p "image-output/crabinet-${ARCH}"
          tar -xf "image-output/crabinet-${ARCH}.tar" -C "image-output/crabinet-${ARCH}"
      - name: Scan OCI archive
        id: image-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          input: image-output/crabinet-${{ env.ARCH }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
      - name: Upload image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-ci-image
      - name: Scan Containerfile configuration
        id: config-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: image-context
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-containerfile.sarif
          exit-code: "1"
      - name: Upload Containerfile SARIF
        if: always() && hashFiles('trivy-containerfile.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-containerfile.sarif
          category: trivy-ci-containerfile
      - name: Load OCI archive for the smoke test
        run: >-
          skopeo copy
          --override-os linux
          --override-arch "${ARCH}"
          "oci-archive:image-output/crabinet-${ARCH}.tar"
          "docker-daemon:crabinet-smoke:${ARCH}"
      - name: Smoke-test the hardened container
        run: >-
          .github/scripts/container-smoke.sh
          "crabinet-smoke:${ARCH}"
          "image-context/release/crabinet-linux-${ARCH}/crabinet"
      - name: Enforce image scans
        if: steps.image-scan.outcome == 'failure' || steps.config-scan.outcome == 'failure'
        run: exit 1

  # A short run of every cargo-fuzz target with the weekly job's pinned
  # nightly. The weekly job keeps the longer campaign.
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      NIGHTLY_VERSION: nightly-2026-09-01
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly Rust toolchain
        run: rustup toolchain install "${NIGHTLY_VERSION}" --profile minimal
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned cargo-fuzz
        run: cargo +"${NIGHTLY_VERSION}" install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked
      - name: Fuzz each security boundary briefly
        run: |
          for target in config_toml phc_policy virtual_path multipart markdown_classification content_disposition; do
            cargo +"${NIGHTLY_VERSION}" fuzz run "${target}" -- -max_total_time=20 -timeout=10
          done
