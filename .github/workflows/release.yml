name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed semantic-version tag to resume
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.90.0
  NODE_VERSION: 24
  TRIVY_VERSION: v0.74.0
  SYFT_VERSION: v1.51.1
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Require manual resumes to run from main
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "${DISPATCH_REF}" != refs/heads/main ]]; then
            echo "Release resumes must be dispatched from main, not ${DISPATCH_REF}" >&2
            exit 1
          fi
      - name: Validate semantic version tag
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions such as v1.2.3" >&2
            exit 1
          fi
      # A fully qualified ref prevents a same-named branch from being built.
      # Full history also fetches every branch, including origin/main.
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Require a verified annotated tag on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "${tag_commit}" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match refs/tags/${RELEASE_TAG}" >&2
            exit 1
          fi
          ref_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '[.object.type, .object.sha] | @tsv')
          IFS=$'\t' read -r ref_type tag_object <<<"${ref_object}"
          if [[ "${ref_type}" != tag ]]; then
            echo "Release tags must be annotated and signed; ${RELEASE_TAG} is lightweight" >&2
            exit 1
          fi
          tag_details=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
            --jq '[.tag, .object.type, .object.sha, (.verification.verified | tostring)] | @tsv')
          IFS=$'\t' read -r tag_name target_type target_sha verified <<<"${tag_details}"
          if [[ "${tag_name}" != "${RELEASE_TAG}" || "${target_type}" != commit || "${target_sha}" != "${tag_commit}" ]]; then
            echo "GitHub's tag object does not match the checked-out ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${verified}" != true ]]; then
            echo "GitHub does not report a verified signature on ${RELEASE_TAG}" >&2
            exit 1
          fi
          git rev-parse --verify refs/remotes/origin/main >/dev/null
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "Tagged commit ${tag_commit} is not on main" >&2
            exit 1
          fi
          echo "commit=${tag_commit}" >> "${GITHUB_OUTPUT}"
      # Only GitHub Actions check runs count, so another app cannot satisfy a
      # required check by reporting a run with the same name.
      - name: Require successful CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          required=(
            "Workflow lint" Frontend Rust Clippy "Browser E2E" "Dependency policy" Semgrep Trivy
            "Container image" "Fuzz smoke" "CodeQL (actions)" "CodeQL (javascript-typescript)"
          )
          checks=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | [.name, .conclusion] | @tsv')
          for name in "${required[@]}"; do
            if ! awk -F '\t' -v required="${name}" '$1 == required && $2 == "success" { found=1 } END { exit !found }' <<<"${checks}"; then
              echo "Required CI check did not succeed: ${name}" >&2
              exit 1
            fi
          done

  frontend:
    name: Build release frontend
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Confirm the verified tagged commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_COMMIT}"
      # Release builds never restore a cache that another workflow wrote.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Build tested production assets
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm rebuild esbuild --ignore-scripts=false
          npm test
          npm run build
      - name: Upload immutable frontend assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  binary:
    name: Binary (${{ matrix.arch }})
    needs: [verify, frontend]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Confirm the verified tagged commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_COMMIT}"
      - name: Download immutable frontend assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup +"${RUST_VERSION}" target add "${{ matrix.target }}"
      - name: Test and build locked release
        env:
          CC: musl-gcc
        run: |
          cargo +"${RUST_VERSION}" test --locked --release --target "${{ matrix.target }}" --all-features
          cargo +"${RUST_VERSION}" build --locked --release --target "${{ matrix.target }}"
      - name: Verify static executable and create package
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          binary="target/${TARGET}/release/crabinet"
          if ldd "${binary}" 2>&1 | grep -vqiE 'not a dynamic executable|statically linked'; then
            echo "Release executable is dynamically linked" >&2
            ldd "${binary}" || true
            exit 1
          fi
          package="release/crabinet-linux-${ARCH}"
          mkdir -p "${package}"
          install -m 0555 "${binary}" "${package}/crabinet"
          install -m 0444 README.md LICENSE THIRD_PARTY_LICENSES.md config.example.toml "${package}/"
          "${package}/crabinet" print-config-schema > "${package}/config.schema.json"
          "${package}/crabinet" --help >/dev/null
          tar -C release -czf "release/crabinet-${VERSION}-linux-${ARCH}.tar.gz" "crabinet-linux-${ARCH}"
      - name: Generate package SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release/crabinet-linux-${{ matrix.arch }}
          format: spdx-json
          output-file: release/crabinet-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
      - name: Record checksums
        working-directory: release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sha256sum \
            "crabinet-${RELEASE_TAG}-linux-${ARCH}.tar.gz" \
            "crabinet-${RELEASE_TAG}-linux-${ARCH}.spdx.json" \
            > "SHA256SUMS-${ARCH}"
      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            release/crabinet-linux-${{ matrix.arch }}
            release/crabinet-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.tar.gz
            release/crabinet-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.spdx.json
            release/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Compilation and tests run dependency code, so the binary jobs hold no OIDC
  # token. This job only downloads the finished archives and attests them.
  attest:
    name: Attest binary archives
    needs: binary
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Attest binary archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/crabinet-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz
            release/crabinet-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz

  image:
    name: Image scan (${{ matrix.arch }})
    needs: [verify, binary]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each image runs natively for its smoke test.
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Confirm the verified tagged commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_COMMIT}"
      - name: Download exact release executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.arch }}
          path: release
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Prepare image context and output
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "image-context/release/crabinet-linux-${ARCH}" image-output
          cp Containerfile LICENSE THIRD_PARTY_LICENSES.md image-context/
          cp "release/crabinet-linux-${ARCH}/crabinet" "image-context/release/crabinet-linux-${ARCH}/crabinet"
      - name: Build exact OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: image-context/Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          outputs: type=oci,dest=image-output/crabinet-${{ matrix.arch }}.tar
          provenance: mode=max
          sbom: true
      - name: Extract OCI layout for scanning
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "image-output/crabinet-${ARCH}"
          tar -xf "image-output/crabinet-${ARCH}.tar" -C "image-output/crabinet-${ARCH}"
      - name: Scan exact OCI archive
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          input: image-output/crabinet-${{ matrix.arch }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          format: sarif
          output: trivy-image-${{ matrix.arch }}.sarif
          exit-code: "1"
      - name: Upload image SARIF
        if: always() && hashFiles(format('trivy-image-{0}.sarif', matrix.arch)) != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image-${{ matrix.arch }}.sarif
          category: trivy-release-${{ matrix.arch }}
      - name: Enforce image scan
        if: steps.scan.outcome == 'failure'
        run: exit 1
      - name: Install OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Load exact OCI archive for the smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: >-
          skopeo copy
          --override-os linux
          --override-arch "${ARCH}"
          "oci-archive:image-output/crabinet-${ARCH}.tar"
          "docker-daemon:crabinet-smoke:${ARCH}"
      # Invariant 14: the image packages the binary inside the attested
      # release archive, byte for byte, and runs hardened.
      - name: Smoke-test the release image against the release archive binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-archive"
          tar -xzf "release/crabinet-${RELEASE_TAG}-linux-${ARCH}.tar.gz" \
            -C "${RUNNER_TEMP}/release-archive" \
            "crabinet-linux-${ARCH}/crabinet"
          .github/scripts/container-smoke.sh \
            "crabinet-smoke:${ARCH}" \
            "${RUNNER_TEMP}/release-archive/crabinet-linux-${ARCH}/crabinet"
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: image-output/crabinet-${{ matrix.arch }}.tar
          format: spdx-json
          output-file: image-output/image-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
      - name: Upload scanned OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: image-output
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release and GHCR manifest
    needs: [verify, image, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Confirm the verified tagged commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_COMMIT}"
      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: publish
          merge-multiple: true
      - name: Download scanned OCI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Install OCI publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Publish scanned architecture images and manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          IFS=. read -r major minor _patch <<<"${version%%[-+]*}"
          for arch in amd64 arm64; do
            skopeo copy \
              --override-os linux \
              --override-arch "${arch}" \
              --dest-creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              --digestfile "${RUNNER_TEMP}/digest-${arch}" \
              "oci-archive:images/crabinet-${arch}.tar" \
              "docker://${IMAGE}:${RELEASE_TAG}-${arch}"
            echo "digest-${arch}=$(cat "${RUNNER_TEMP}/digest-${arch}")" >> "${GITHUB_OUTPUT}"
          done
          tags=("${IMAGE}:${RELEASE_TAG}")
          # Floating tags move only for the highest stable release, so
          # publishing a patch for an older line never rolls them back.
          highest=$(git tag -l 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [[ "${RELEASE_TAG}" == "${highest}" ]]; then
            tags+=("${IMAGE}:${major}.${minor}" "${IMAGE}:${major}" "${IMAGE}:latest")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "${tag}"); done
          docker buildx imagetools create \
            "${args[@]}" \
            "${IMAGE}:${RELEASE_TAG}-amd64" \
            "${IMAGE}:${RELEASE_TAG}-arm64"
          digest="sha256:$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --raw | sha256sum | cut -d' ' -f1)"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${IMAGE}" "${digest}" > publish/IMAGE-DIGESTS
      - name: Attest published image manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      # skopeo copies only the platform image from each OCI archive, so
      # BuildKit's in-index provenance does not reach the registry. Attest
      # each architecture digest that a platform-specific pull resolves to.
      - name: Attest published amd64 image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest-amd64 }}
          push-to-registry: true
      - name: Attest published arm64 image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest-arm64 }}
          push-to-registry: true
      - name: Require provenance for the index and every architecture
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          INDEX_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          # The published index must list exactly the digests attested here.
          raw_index=$(docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" --raw)
          digests=("${INDEX_DIGEST}")
          for arch in amd64 arm64; do
            digest=$(jq -r --arg arch "${arch}" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
              <<<"${raw_index}")
            expected=$(cat "${RUNNER_TEMP}/digest-${arch}")
            if [[ "${digest}" != "${expected}" ]]; then
              echo "Index lists ${arch} as '${digest}', but ${expected} was pushed" >&2
              exit 1
            fi
            digests+=("${digest}")
          done
          for digest in "${digests[@]}"; do
            gh attestation verify "oci://${IMAGE}@${digest}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners \
              >/dev/null
            echo "Verified provenance for ${IMAGE}@${digest}"
          done
      - name: Assemble checksums
        working-directory: publish
        run: |
          {
            cat SHA256SUMS-amd64 SHA256SUMS-arm64
            sha256sum IMAGE-DIGESTS
            (cd ../images && sha256sum image-*.spdx.json)
          } | sort -k2 > SHA256SUMS
      - name: Publish GitHub release atomically after all gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Crabinet ${RELEASE_TAG}" \
            "${release_flags[@]}" \
            publish/crabinet-*.tar.gz \
            publish/crabinet-*.spdx.json \
            images/image-*.spdx.json \
            publish/SHA256SUMS \
            publish/IMAGE-DIGESTS
