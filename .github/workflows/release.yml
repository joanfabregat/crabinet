name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed semantic-version tag to resume
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.90.0
  NODE_VERSION: 24
  TRIVY_VERSION: v0.74.0
  SYFT_VERSION: v1.51.1
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate semantic version tag
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions such as v1.2.3" >&2
            exit 1
          fi
      - name: Require successful CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          required=(Frontend Rust "Browser E2E" "Dependency policy" Semgrep Trivy)
          checks=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .conclusion] | @tsv')
          for name in "${required[@]}"; do
            if ! awk -F '\t' -v required="${name}" '$1 == required && $2 == "success" { found=1 } END { exit !found }' <<<"${checks}"; then
              echo "Required CI check did not succeed: ${name}" >&2
              exit 1
            fi
          done

  frontend:
    name: Build release frontend
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build tested production assets
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Upload immutable frontend assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  binary:
    name: Binary (${{ matrix.arch }})
    needs: frontend
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Download immutable frontend assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup +"${RUST_VERSION}" target add "${{ matrix.target }}"
      - name: Test and build locked release
        run: |
          cargo +"${RUST_VERSION}" test --locked --release --target "${{ matrix.target }}" --all-features
          cargo +"${RUST_VERSION}" build --locked --release --target "${{ matrix.target }}"
      - name: Verify static executable and create package
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          binary="target/${TARGET}/release/crabinet"
          if ldd "${binary}" 2>&1 | grep -vqiE 'not a dynamic executable|statically linked'; then
            echo "Release executable is dynamically linked" >&2
            ldd "${binary}" || true
            exit 1
          fi
          package="release/crabinet-linux-${ARCH}"
          mkdir -p "${package}"
          install -m 0555 "${binary}" "${package}/crabinet"
          install -m 0444 README.md LICENSE LICENSE-CCADB config.example.toml "${package}/"
          "${package}/crabinet" print-config-schema > "${package}/config.schema.json"
          "${package}/crabinet" --help >/dev/null
          tar -C release -czf "release/crabinet-${VERSION}-linux-${ARCH}.tar.gz" "crabinet-linux-${ARCH}"
      - name: Generate package SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release/crabinet-linux-${{ matrix.arch }}
          format: spdx-json
          output-file: release/crabinet-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
      - name: Record checksums
        working-directory: release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sha256sum \
            "crabinet-${RELEASE_TAG}-linux-${ARCH}.tar.gz" \
            "crabinet-${RELEASE_TAG}-linux-${ARCH}.spdx.json" \
            > "SHA256SUMS-${ARCH}"
      - name: Attest binary archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/crabinet-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.tar.gz
      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            release/crabinet-linux-${{ matrix.arch }}
            release/crabinet-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.tar.gz
            release/crabinet-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.spdx.json
            release/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  image:
    name: Image scan (${{ matrix.arch }})
    needs: binary
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Download exact release executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.arch }}
          path: release
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare image output
        run: mkdir -p image-output
      - name: Build exact OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          outputs: type=oci,dest=image-output/crabinet-${{ matrix.arch }}.tar
          provenance: mode=max
          sbom: true
      - name: Extract OCI layout for scanning
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "image-output/crabinet-${ARCH}"
          tar -xf "image-output/crabinet-${ARCH}.tar" -C "image-output/crabinet-${ARCH}"
      - name: Scan exact OCI archive
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          input: image-output/crabinet-${{ matrix.arch }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          format: sarif
          output: trivy-image-${{ matrix.arch }}.sarif
          exit-code: "1"
      - name: Upload image SARIF
        if: always() && hashFiles(format('trivy-image-{0}.sarif', matrix.arch)) != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image-${{ matrix.arch }}.sarif
          category: trivy-release-${{ matrix.arch }}
      - name: Enforce image scan
        if: steps.scan.outcome == 'failure'
        run: exit 1
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: image-output/crabinet-${{ matrix.arch }}.tar
          format: spdx-json
          output-file: image-output/image-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
      - name: Upload scanned OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: image-output
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release and GHCR manifest
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: publish
          merge-multiple: true
      - name: Download scanned OCI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Install OCI publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish scanned architecture images and manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          IFS=. read -r major minor _patch <<<"${version%%[-+]*}"
          for arch in amd64 arm64; do
            skopeo copy \
              --override-os linux \
              --override-arch "${arch}" \
              --dest-creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "oci-archive:images/crabinet-${arch}.tar" \
              "docker://${IMAGE}:${RELEASE_TAG}-${arch}"
          done
          tags=("${IMAGE}:${RELEASE_TAG}")
          if [[ "${version}" != *-* && "${version}" != *+* ]]; then
            tags+=("${IMAGE}:${major}.${minor}" "${IMAGE}:${major}" "${IMAGE}:latest")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "${tag}"); done
          docker buildx imagetools create \
            "${args[@]}" \
            "${IMAGE}:${RELEASE_TAG}-amd64" \
            "${IMAGE}:${RELEASE_TAG}-arm64"
          digest="sha256:$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --raw | sha256sum | cut -d' ' -f1)"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${IMAGE}" "${digest}" > publish/IMAGE-DIGESTS
      - name: Attest published image manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Assemble checksums
        working-directory: publish
        run: |
          cat SHA256SUMS-amd64 SHA256SUMS-arm64 | sort -k2 > SHA256SUMS
          sha256sum IMAGE-DIGESTS >> SHA256SUMS
      - name: Publish GitHub release atomically after all gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Crabinet ${RELEASE_TAG}" \
            "${release_flags[@]}" \
            publish/crabinet-*.tar.gz \
            publish/crabinet-*.spdx.json \
            images/image-*.spdx.json \
            publish/SHA256SUMS \
            publish/IMAGE-DIGESTS
