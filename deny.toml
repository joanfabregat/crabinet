[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-core" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-proto" },
  { allow = ["MPL-2.0"], crate = "webauthn-attestation-ca" },
  { allow = ["MPL-2.0"], crate = "base64urlsafedata" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
