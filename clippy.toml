# Threat-model invariants 1 and 2: request-time filesystem access goes through
# capabilities opened in src/filesystem.rs. Ambient path-based APIs are
# disallowed elsewhere; the few startup and test uses carry a reasoned
# `#[expect(clippy::disallowed_methods)]`. Mirrored by .semgrep/crabinet.yml.
