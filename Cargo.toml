[package]
name = "index"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "A secure, low-memory, multi-user file browser"
repository = "https://github.com/joanfabregat/index"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json", "multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
