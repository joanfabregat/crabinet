[package]
name = "index"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "A secure, low-memory, multi-user file browser"
repository = "https://github.com/joanfabregat/index"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = { version = "0.8.9", features = ["json", "multipart"] }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
rpassword = "7.5.4"
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace"] }
toml = "1.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
